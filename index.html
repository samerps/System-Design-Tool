<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Encrypted stlite experiment</title>

    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.50.0/build/stlite.js"></script>
</head>

<body>
    <div id="root"></div>

    <script>
        async function loadTextFile(url) {
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(`Failed to load ${url}: ${response.status}`);
            }

            return await response.text();
        }

        async function loadBinaryFile(url) {
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(`Failed to load ${url}: ${response.status}`);
            }

            return new Uint8Array(await response.arrayBuffer());
        }

        async function startApp() {

            const app = await loadTextFile("app.py");

            const inverterBase =
                await decryptFile("inverter_base.py.enc");

            const logo =
                await loadBinaryFile("assets/logo.png");

            stlite.mount(
                {
                    requirements: ["numpy"],

                    entrypoint: "app.py",

                    files: {
                        "app.py": app,
                        "inverter_base.py": inverterBase,
                        "assets/logo.png": logo
                    }
                },

                document.getElementById("root")
            );
        }

        async function decryptFile(url) {

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Failed to load ${url}: ${response.status}`);
                }

                const encrypted = new Uint8Array(
                    await response.arrayBuffer()
                );

                console.log("Encrypted file size:", encrypted.length);

                // First 12 bytes = AES-GCM nonce
                const nonce = encrypted.slice(0, 12);

                // Everything after the nonce = ciphertext + authentication tag
                const ciphertext = encrypted.slice(12);

                const keyBytes = new TextEncoder().encode(
                    "01234567890123456789012345678901"
                );

                console.log("Key length:", keyBytes.length);
                console.log("Nonce length:", nonce.length);
                console.log("Ciphertext length:", ciphertext.length);

                const cryptoKey = await crypto.subtle.importKey(
                    "raw",
                    keyBytes,
                    {
                        name: "AES-GCM"
                    },
                    false,
                    ["decrypt"]
                );

                const decrypted = await crypto.subtle.decrypt(
                    {
                        name: "AES-GCM",
                        iv: nonce
                    },
                    cryptoKey,
                    ciphertext
                );

                return new TextDecoder().decode(decrypted);
            }

        startApp().catch(error => {
            console.error(error);

            document.getElementById("root").innerHTML =
                `<pre>${error.stack || error}</pre>`;
        });
    </script>
</body>
</html>
